name: jobs
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    container:
      image: espressif/idf:release-v5.4
    steps:
      - uses: actions/checkout@v4
      - name: kieszlunek
        uses: actions/cache@v4
        with:
          path: build/
          key: gcc-${{ hashFiles('components/**/*') }}
          restore-keys: gcc-
      - run: . $IDF_PATH/export.sh
          && idf.py build
        working-directory: ./esp32

  clang-tidy:
    runs-on: self-hosted
    container:
      image: espressif/idf:release-v5.4
    steps:
      - uses: actions/checkout@v4
      - run: . $IDF_PATH/export.sh
          && idf_tools.py install esp-clang
          && . $IDF_PATH/export.sh
          && IDF_TOOLCHAIN=clang idf.py reconfigure
          && ./scripts/tidy.sh
        working-directory: ./esp32

  clanf-format:
    runs-on: self-hosted
    container:
      image: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - run: apk add clang20-extra-tools
          && ./scripts/format.sh
        working-directory: ./esp32
