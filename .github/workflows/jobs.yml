name: jobs
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    container:
      image: espressif/idf:release-v5.4
    needs: clang-format
    steps:
      - uses: actions/checkout@v6
      - name: kieszlunek
        uses: actions/cache@v5
        with:
          path: esp32/build/
          key: gcc-${{github.ref_name}}-${{hashFiles('esp32/components/**/*')}}
          restore-keys: gcc-${{github.ref_name}}
      - run: . $IDF_PATH/export.sh
          && idf.py build -DCI=on
        working-directory: ./esp32

  clang-tidy:
    runs-on: self-hosted
    container:
      image: wkukielk/esp-idf-clang:v5.5
      credentials:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    needs: build
    steps:
      - uses: actions/checkout@v6
      - run: . $IDF_PATH/export.sh
          && IDF_TOOLCHAIN=clang idf.py reconfigure -DCI=on
          && ./scripts/tidy.sh
        working-directory: ./esp32

  clang-format:
    runs-on: self-hosted
    container:
      image: alpine:3.23
    steps:
      - uses: actions/checkout@v6
      - run: apk add clang-extra-tools
          && ./scripts/format.sh
        working-directory: ./esp32

  test-backend:
    runs-on: self-hosted
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v6
      - run: pip install uv
          && uv sync --frozen --all-groups
          && python3 -m flake8 --ignore='' app/
          && python3 -m pytest
        working-directory: ./backend
