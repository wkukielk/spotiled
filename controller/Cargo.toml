[package]
name = "controller"
version = "0.1.0"
edition = "2024"

[dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["native-tls", "with-libmdns"] }
vergen-gitcl = "=1.0.8"
vergen = "=9.0.6"
vergen-lib = "=9.1.0"
log = "0.4.33"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
env_logger = "0.11.10"
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls"] }
bytes = "1.12.0"
tokio-tungstenite = "0.28.0"
futures-util = "0.3.31"
cxx = "1.0.194"
image = { version = "0.25.6", default-features = false, features = ["jpeg"] }
thiserror = "2.0.18"
anyhow = "1.0.102"
hostname = "0.4.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
cmake = "0.1.58"
cxx-build = "1.0.194"

[dev-dependencies]
mockall = "0.14.0"
wiremock = "0.6.5"
